name: Package release editions
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build both complete Skill editions
        run: |
          python scripts/package_skill.py --language en --output dist/paper-story-reader-en-${{ github.event.release.tag_name }}.zip
          python scripts/package_skill.py --language zh --output dist/paper-story-reader-zh-${{ github.event.release.tag_name }}.zip
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
      - name: Attach installable packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}"
